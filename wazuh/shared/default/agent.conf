<!--
  Centralised Wazuh agent configuration for the "default" group (SOC Phase 2b).
  Delivered by the manager to every enrolled agent (today: vps1-prod = the SURF
  production server). Host-side ossec.conf only carries the manager address.
-->
<agent_config>

  <!-- File integrity: realtime on the production stack + SSH trust + tunnel keys;
       the OS config tree on a 6 h cycle. report_changes stores diffs for text files. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>21600</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes" report_changes="yes">/opt/surf,/root/.ssh,/etc/wireguard,/etc/ssh</directories>
    <directories check_all="yes">/etc,/usr/local/bin</directories>
    <ignore>/opt/surf/backups</ignore>
    <ignore>/opt/surf/.git</ignore>
    <ignore>/opt/surf/reports</ignore>
    <ignore type="sregex">.log$|.gz$|.swp$</ignore>
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/resolv.conf</ignore>
    <nodiff>/opt/surf/.env</nodiff>
    <nodiff>/etc/wireguard/wg0.conf</nodiff>
    <skip_nfs>yes</skip_nfs>
  </syscheck>

  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <frequency>43200</frequency>
  </rootcheck>

  <!-- CIS benchmark (Ubuntu policy ships with the agent): the automated version
       of our SEC-SSH audit, every 12 h. -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- Inventory for the manager's vulnerability detection. -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
  </wodle>

  <!-- sshd log for Wazuh's own authentication rules (and a future Active
       Response). Deliberately duplicates the Vector → ingest path. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

</agent_config>
