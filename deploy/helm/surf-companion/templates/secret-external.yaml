{{- if .Values.externalSecrets.enabled }}
# Pulls secrets from Vault via the External Secrets Operator into a Kubernetes
# Secret the backend consumes with envFrom. See docs/SECRETS.md for the Vault
# paths and per-role policies.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "surf-companion.fullname" . }}-secrets
  labels:
    {{- include "surf-companion.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "surf-companion.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: PG_PASSWORD
      remoteRef: { key: "{{ .Values.externalSecrets.remotePathPrefix }}/shared/postgres", property: password }
    - secretKey: OPENSEARCH_PASSWORD
      remoteRef: { key: "{{ .Values.externalSecrets.remotePathPrefix }}/shared/opensearch", property: password }
    - secretKey: MINIO_SECRET_KEY
      remoteRef: { key: "{{ .Values.externalSecrets.remotePathPrefix }}/shared/minio", property: secretKey }
    - secretKey: WAZUH_API_PASS
      remoteRef: { key: "{{ .Values.externalSecrets.remotePathPrefix }}/backend/wazuh", property: password }
    - secretKey: PAGERDUTY_ROUTING_KEY
      remoteRef: { key: "{{ .Values.externalSecrets.remotePathPrefix }}/backend/pagerduty", property: routingKey }
    - secretKey: FLEX_API_TOKEN
      remoteRef: { key: "{{ .Values.externalSecrets.remotePathPrefix }}/backend/flex", property: token }
    - secretKey: EMS_API_TOKEN
      remoteRef: { key: "{{ .Values.externalSecrets.remotePathPrefix }}/backend/ems", property: token }
    - secretKey: INGEST_TOKEN
      remoteRef: { key: "{{ .Values.externalSecrets.remotePathPrefix }}/backend/ingest", property: token }
{{- end }}
