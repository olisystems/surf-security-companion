title: Partner API key failures
id: b082baac-f034-454f-b750-665294692287
status: test
description: >
  Detects more than 10 HTTP 401/403 responses on the public partner API
  (api.surf.saarland/external/v1/*, X-API-Key authenticated) from one source
  IP within 10 minutes. Partners hold long-lived keys, so a burst of rejected
  calls indicates key guessing, a leaked-and-revoked key being replayed, or a
  partner integration that is misconfigured and needs to be contacted.
author: SURF Detection Team
date: 2026/10/05
references:
  - https://attack.mitre.org/techniques/T1110/
  - https://attack.mitre.org/techniques/T1078/
tags:
  - attack.credential_access
  - attack.t1110
  - surf.threat.AV-05
  - nis2.art.21.2.b
level: medium
logsource:
  product: caddy
  service: partner-api
detection:
  selection:
    http.response.status_code:
      - 401
      - 403
    url.path|contains: '/external/v1/'
  timeframe: 10m
  condition: selection | count() by source.ip > 10
falsepositives:
  - Partner key rotation where the old key is still configured on their side (coordinate the switch-over)
  - Partner load tests against the sandbox tenant
owner: detection-team@surf
surf.threat_id: AV-05
surf.compliance:
  - "NIS2 Art. 21(2)(b)"
  - "IEC 62443-3-3 FR1.5"
  - "KRITIS §8a BSIG"
  - "ISO 27001 A.8.5"
