# PROD variant (VPS2, behind Caddy): no bundled-Keycloak proxying,
# IdP = auth.surf.saarland (realm surf-security). Derived from nginx.conf.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
    '"status":$status,"bytes":$body_bytes_sent,"request_id":"$request_id",'
    '"upstream":"$upstream_addr","duration":$request_time}';
  access_log /dev/stdout json_combined;

  # ---- rate limiting: stricter on auth-adjacent paths
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  upstream backend  { server backend:8080; }
  upstream frontend { server frontend:8081; }

  # HTTP -> HTTPS
  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name security.surf.saarland;

    # ---- TLS 1.3 only
    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ---- security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    # ---- nonce-based CSP (nonce minted per request)
    set $csp_nonce $request_id;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$csp_nonce'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://auth.surf.saarland https://otel-collector.local:4318; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://auth.surf.saarland" always;

    # request id propagated end-to-end
    proxy_set_header x-request-id $request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /healthz {
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://backend/;
      proxy_read_timeout 60s;
    }

    # Browser OTLP traces, same-origin over TLS (collector itself is plain HTTP)
    location /otel/ {
      proxy_pass http://otel-collector:4318/;
    }


    location / {
      limit_req zone=api burst=120 nodelay;
      proxy_pass http://frontend;
    }
  }
}
